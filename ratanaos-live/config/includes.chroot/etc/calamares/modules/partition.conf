# RatanaOS Calamares Partition Module Configuration
# Enables LUKS full-disk encryption as a user-selectable option

efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
defaultPartitionTableType: gpt

# LUKS encryption support — user can opt-in during install
encryptionType: luks
initialEncryptionChoice: false
allowManualPartitioning: true
