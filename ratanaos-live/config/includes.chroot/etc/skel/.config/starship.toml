# ==============================================================================
# RatanaOS — Starship Cross-Shell Prompt
# Clean, modern, informative prompt with Git & execution indicators
# ==============================================================================

format = """
[╭─](bold #0A84FF)$os$directory$git_branch$git_status$package$golang$rust$python$nodejs
[╰─](bold #0A84FF)$character
"""

add_newline = true

[os]
format = "[$symbol]($style) "
style = "bold #0A84FF"
disabled = false

[os.symbols]
Debian = " "
Linux = "󰌽 "

[directory]
style = "bold #5AC8FA"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold #BB9AF7"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #F7768E"
format = "([$all_status$ahead_behind]($style) )"

[character]
success_symbol = "[❯](bold #0A84FF)"
error_symbol = "[❯](bold #FF453A)"
