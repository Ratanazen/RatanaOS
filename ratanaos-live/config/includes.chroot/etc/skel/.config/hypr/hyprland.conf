# ==============================================================================
# RatanaOS Hyprland Configuration (macOS Sequoia 2026 Edition)
# ==============================================================================

# Monitor setup
monitor=,preferred,auto,1

# Autostart essential services
exec-once = waybar
exec-once = swaybg -i /usr/share/backgrounds/ratanaos/tahoe_dark.jpg -m fill
exec-once = mako
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --watch cliphist store

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# macOS Visual Aesthetics
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(00bbf9ee) rgba(9b5de5ee) 45deg
    col.inactive_border = rgba(255255251a)
    layout = dwindle
}

# Window Decorations & Frosted Glass Blur
decoration {
    rounding = 14
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }
    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(0000004d)
    active_opacity = 0.96
    inactive_opacity = 0.90
}

# Smooth macOS Fluid Animations
animations {
    enabled = true
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    animation = windows, 1, 4, fluent_decel, popin 80%
    animation = windowsOut, 1, 4, fluent_decel, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, fluent_decel, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Keybindings (Super/Command based)
$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, firefox-esr

# Window Controls (macOS style: Super+Q / Super+W)
bind = $mainMod, Q, killactive,
bind = $mainMod, W, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse window move & resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
