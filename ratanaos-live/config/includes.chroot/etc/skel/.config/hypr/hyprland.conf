# ==============================================================================
#  RatanaOS 2026 - macOS Sequoia M4 Pro Edition (Hyprland Configuration)
# ==============================================================================

# Display
monitor=,preferred,auto,1

# Autostart Ecosystem
exec-once = waybar -c ~/.config/waybar/config-top.json -s ~/.config/waybar/style-top.css
exec-once = waybar -c ~/.config/waybar/config-dock.json -s ~/.config/waybar/style-dock.css
exec-once = swaybg -i /usr/share/backgrounds/ratanaos/ratanaos-tahoe-blue.png -m fill
exec-once = mako
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --watch cliphist store

# Environment Variables
env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24
env = GTK_THEME,WhiteSur-Dark
env = QT_QPA_PLATFORMTHEME,qt5ct

# Input & Trackpad Gestures (Apple Multi-Touch Experience)
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        clickfinger_behavior = true
    }
    sensitivity = 0.1
    accel_profile = adaptive
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
}

# Apple M4 Pro Ultra-Fluid Visuals
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(00bbf9ee) rgba(9b5de5ee) 45deg
    col.inactive_border = rgba(2552552515)
    layout = dwindle
    no_cursor_warps = true
}

# Acrylic Translucency & Soft Shadows
decoration {
    rounding = 16
    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        xray = false
        brightness = 1.05
        contrast = 1.1
    }
    drop_shadow = true
    shadow_range = 28
    shadow_render_power = 4
    col.shadow = rgba(00000066)
    active_opacity = 0.97
    inactive_opacity = 0.90
}

# 120Hz ProMotion Physics & Beziers
animations {
    enabled = true
    bezier = appleEase, 0.16, 1, 0.3, 1
    bezier = fluentDecel, 0.05, 0.9, 0.1, 1.0
    
    animation = windows, 1, 4, appleEase, popin 85%
    animation = windowsOut, 1, 3, appleEase, popin 85%
    animation = border, 1, 6, default
    animation = fade, 1, 4, appleEase
    animation = workspaces, 1, 5, fluentDecel, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Window Rules (macOS Floating Dialogs)
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,class:^(gnome-calculator)$
windowrulev2 = float,class:^(calamares)$
windowrulev2 = center,class:^(calamares)$
windowrulev2 = float,class:^(wofi)$

# Keybindings (Apple Command / Super Mapping)
$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, firefox-esr
bind = $mainMod, L, exec, ratana-lock

# Screenshots (macOS Cmd+Shift+3 & Cmd+Shift+4)
bind = $mainMod SHIFT, 3, exec, ratana-screenshot full
bind = $mainMod SHIFT, 4, exec, ratana-screenshot area

# macOS Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, W, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, togglefloating,
bind = $mainMod, J, togglesplit,

# Workspaces Navigation (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Window Dragging & Resizing with Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
