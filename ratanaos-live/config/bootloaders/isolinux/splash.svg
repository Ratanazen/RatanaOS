<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="480" viewBox="0 0 640 480" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a233a"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="45%" stop-color="#00BBF9"/>
      <stop offset="100%" stop-color="#9B5DE5"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bgGrad)"/>

  <!-- Subtle glow ambient -->
  <circle cx="100" cy="70" r="120" fill="#00BBF9" opacity="0.15" filter="blur(40px)"/>
  <circle cx="540" cy="420" r="150" fill="#9B5DE5" opacity="0.12" filter="blur(50px)"/>

  <!-- Header Card Glass -->
  <rect x="30" y="20" width="580" height="95" rx="16" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- RatanaOS Logo Icon -->
  <g transform="translate(50, 32)">
    <!-- Squircle Icon Base -->
    <rect width="70" height="70" rx="18" fill="url(#logoGrad)"/>
    <rect width="70" height="70" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Stylized 'R' Core -->
    <path d="M22 18 H38 C46 18 51 22 51 28 C51 34 46 38 38 38 H29 V52 H22 V18 Z M29 24 V32 H38 C42 32 44 30 44 28 C44 26 42 24 38 24 H29 Z M37 36 L48 52 H40 L31 38 L37 36 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Title Text -->
  <text x="135" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    RatanaOS 2026
  </text>
  <text x="135" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#00BBF9">
    macOS Sequoia &amp; Tahoe Edition • Live System (amd64)
  </text>
  <text x="135" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">
    Kernel: Linux 6.1 (RatanaOS) • Fast Zstandard Boot Architecture
  </text>
</svg>
