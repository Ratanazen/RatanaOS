  <circle cx="256" cy="256" r="240" fill="url(#cyberBg)" stroke="#06b6d4" stroke-width="6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  
