# ==============================================================================
# RiOS — Foot Wayland Terminal Configuration
# Lightweight, ultra-fast Wayland native terminal
# ==============================================================================

font=JetBrains Mono Nerd Font:size=11
pad=12x12

[cursor]
style=beam
blink=yes
color=16161E 0A84FF

[colors]
alpha=0.92
foreground=C0CAF5
background=16161E

# Black
regular0=1F2335
bright0=3B4261

# Red
regular1=F7768E
bright1=FF453A

# Green
regular2=9ECE6A
bright2=34C759

# Yellow
regular3=E0AF68
bright3=FF9F0A

# Blue
regular4=0A84FF
bright4=5AC8FA

# Magenta
regular5=BB9AF7
bright5=AF52DE

# Cyan
regular6=7DCFFF
bright6=00F0FF

# White
regular7=C0CAF5
bright7=FFFFFF

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy Super+c
clipboard-paste=Control+Shift+v XF86Paste Super+v
font-increase=Control+plus Control+equal Super+equal
font-decrease=Control+minus Super+minus
font-reset=Control+0 Super+0
