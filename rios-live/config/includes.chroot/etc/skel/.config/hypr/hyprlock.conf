# ==============================================================================
# RiOS — Hyprlock Modern Lockscreen
# Large typography, blurred acrylic background, user avatar, and shield branding
# ==============================================================================

background {
    monitor =
    path = /usr/share/backgrounds/rios/rios-sequoia-dark.png
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.8
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(0a84ff)
    inner_color = rgba(22, 22, 30, 0.75)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">Enter Password...</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    rounding = 16
}

# Large Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(192, 202, 245, 0.8)
    font_size = 18
    font_family = Inter Medium
    position = 0, 90
    halign = center
    valign = center
}

# RiOS Branding
label {
    monitor =
    text = RiOS 2026
    color = rgba(10, 132, 255, 0.9)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 40
    halign = center
    valign = center
}

# User avatar / shield logo icon
image {
    monitor =
    path = /usr/share/pixmaps/ri-logo.png
    size = 96
    rounding = -1
    border_size = 3
    border_color = rgb(0a84ff)
    position = 0, -20
    halign = center
    valign = center
}
