# ==============================================================================
# RiOS — Hyprland Fluid Animations
# Modeled after Apple ProMotion fluid dynamics (120Hz smooth bezier curves)
# ==============================================================================

animations {
    enabled = true

    # Cubic bezier physics definitions
    bezier = appleEase, 0.25, 1, 0.5, 1
    bezier = appleBounce, 0.34, 1.35, 0.64, 1
    bezier = smoothFast, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.16, 1, 0.3, 1
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    # Window open/close/move animations
    animation = windows, 1, 4, smoothFast, popin 80%
    animation = windowsIn, 1, 4, appleEase, popin 80%
    animation = windowsOut, 1, 3, smoothOut, popin 85%
    animation = windowsMove, 1, 4, appleEase

    # Border & Fade
    animation = border, 1, 5, appleEase
    animation = borderangle, 1, 30, linear, loop
    animation = fade, 1, 3, appleEase
    animation = fadeDim, 1, 4, smoothOut

    # Workspace transitions
    animation = workspaces, 1, 4, appleEase, slide
    animation = specialWorkspace, 1, 4, appleEase, slidevert
}
