# ==============================================================================
# RiOS — Hyprland Window Rules & Layer Blur
# Acrylic glass effects, smart dialog floating, and window placement
# ==============================================================================

# Floating system dialogs and utilities
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(galculator|kcalc|org.gnome.Calculator)$
windowrulev2 = float, class:^(org.gnome.FileRoller)$
windowrulev2 = float, class:^(calamares)$
windowrulev2 = center, class:^(calamares)$
windowrulev2 = size 1000 650, class:^(calamares)$

# File chooser dialogs
windowrulev2 = float, title:^(Open File|Save File|Choose Files|Select Folder)$
windowrulev2 = center, title:^(Open File|Save File|Choose Files|Select Folder)$

# Polkit authentication modal
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = dimaround, class:^(polkit-gnome-authentication-agent-1)$

# Picture-in-Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move 72% 72%, title:^(Picture-in-Picture)$
windowrulev2 = size 26% 26%, title:^(Picture-in-Picture)$

# Scratchpad terminal
windowrulev2 = float, class:^(ri-scratchpad)$
windowrulev2 = size 70% 60%, class:^(ri-scratchpad)$
windowrulev2 = center, class:^(ri-scratchpad)$

# Glass opacity rules
windowrulev2 = opacity 0.94 0.88, class:^(kitty|foot)$
windowrulev2 = opacity 0.96 0.92, class:^(thunar|dolphin|org.gnome.Nautilus)$

# Layer rules for translucent Waybar, Wofi, SwayNC, and Notification popups
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-notification-window
