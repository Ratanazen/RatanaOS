# ==============================================================================
# RiOS Calamares Master Installer Sequence
# Ensures complete disk partitioning, bootloader setup, package cleanup,
# and initramfs generation for real hardware boot.
# ==============================================================================

modules-search: [ local, /usr/lib/calamares/modules, /usr/lib/x86_64-linux-gnu/calamares/modules ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - sources-final
  - umount
- show:
  - finished

branding: rios
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
quit-at-end: false
