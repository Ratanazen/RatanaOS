set timeout=3
set default=0

insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
insmod all_video

menuentry "RatanaOS 64-bit (macOS Sequoia Edition)" {
    set gfxpayload=1024x768x32,1024x768,auto
    multiboot /boot/ratanaos.bin
    boot
}

menuentry "RatanaOS 64-bit (Safe Text Mode / CLI)" {
    set gfxpayload=text
    multiboot /boot/ratanaos.bin
    boot
}

# Track A — Dual Boot Configuration (Existing Debian Partition)
# Note: Adjust root=(hdX,gptY) and root=/dev/sdaX according to your host partition table
menuentry "Debian GNU/Linux (Dual Boot Partition)" {
    insmod part_gpt
    insmod ext2
    set root='(hd0,gpt2)'
    linux /boot/vmlinuz root=/dev/sda2 ro quiet
    initrd /boot/initrd.img
}

# Track A — Embedded Debian Installer / Live ISO Boot
if [ -f /debian.iso ]; then
    menuentry "Install / Boot Debian GNU/Linux (Embedded ISO)" {
        insmod loopback
        insmod iso9660
        loopback loop /debian.iso
        linux (loop)/install.amd/vmlinuz boot=live quiet
        initrd (loop)/install.amd/initrd.gz
    }
fi

