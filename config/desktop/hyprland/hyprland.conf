# ==============================================================================
# RiOS — Hyprland Master Configuration
# Modular architecture sourcing dedicated subsystems
# ==============================================================================

# Sourced modules
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/environment.conf
source = ~/.config/hypr/startup.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/keybinds.conf

# Input Devices (Apple Trackpad gestures, natural scrolling, smooth acceleration)
input {
    kb_layout = us,kh
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 0.85
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(0a84ff) rgb(5ac8fa) 45deg
    col.inactive_border = rgba(565f8955)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 16
    active_opacity = 0.96
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 0.95
        brightness = 0.90
    }

    drop_shadow = true
    shadow_range = 24
    shadow_render_power = 4
    col.shadow = rgba(00000055)
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_is_master = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
}
