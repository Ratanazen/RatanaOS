# ==============================================================================
# RatanaOS — Hyprland Autostart Daemons & Services
# Launches Waybar, SwayNC, Hypridle, Polkit, Audio, and Theme Engine
# ==============================================================================

# Authentication agent (Polkit)
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1

# Status Bar & Notification Center
exec-once = waybar
exec-once = swaync

# Idle management & screen lock
exec-once = hypridle || true

# XDG Desktop Portal Wayland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store 2>/dev/null || true
exec-once = wl-paste --type image --watch cliphist store 2>/dev/null || true

# Wallpaper daemon & Theme initialization
exec-once = swww-daemon || swaybg -i /usr/share/backgrounds/ratanaos/ratanaos-sequoia-dark.png -m fill || true
exec-once = ratana-theme apply || true

# First-run welcome check
exec-once = [ ! -f ~/.config/ratana/.first-run-done ] && ratana-first-run || true
