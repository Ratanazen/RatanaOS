# ==============================================================================
# RatanaOS — Kitty Terminal Configuration
# High performance, GPU accelerated, blurred background, JetBrains Mono font
# ==============================================================================

font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window styling & acrylic padding
window_padding_width 14
window_margin_width 0
hide_window_decorations yes
confirm_os_window_close 0

# Dynamic theme include (managed by ratana-theme)
include theme.conf

# Fallback colors if theme.conf is not yet generated
foreground #C0CAF5
background #16161E
background_opacity 0.90
background_blur 16

# Tab Bar
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #FFFFFF
active_tab_background   #0A84FF
inactive_tab_foreground #565F89
inactive_tab_background #1F2335

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map super+c copy_to_clipboard
map super+v paste_from_clipboard
map super+equal change_font_size all +1.0
map super+minus change_font_size all -1.0
map super+0 change_font_size all 0
