"$schema" = 'https://starship.rs/config-schema.json'

# Insert a blank line between shell commands for visual breathing room
add_newline = true

# Clean two-line layout
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# Prompt character on line 2
[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Username (subtle, clean, displays user if needed)
[username]
show_always = false
style_user = "bold purple"
style_root = "bold red"
format = "[$user]($style) in "

# Directory (Line 1: clean bold blue path)
[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 4
truncation_symbol = "…/"
home_symbol = "~"

# Directory path substitutions with clean icons
[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = " Music"
"Pictures" = " Pictures"

# Git branch (clean purple)
[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

# Git status indicators
[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = " "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

# Command execution time (only displayed if command took more than 2 seconds)
[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

# Language & runtime indicators
[nodejs]
disabled = false
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "via [${symbol}${pyenv_prefix}(${version} )]($style)"

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "

[package]
disabled = true

[os]
disabled = false
style = "bold cyan"

[os.symbols]
Debian = " "
Linux = "󰌽 "
