name: Build RatanaOS ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build/**'
      - 'branding/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-iso.yml'
      - 'Makefile'
      - 'VERSION'
  push:
    branches: [main, feature/build-system]
    paths:
      - 'build/**'
      - 'branding/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'Makefile'
      - 'VERSION'

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: debian:stable
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates coreutils debootstrap dosfstools \
            grub-efi-amd64-bin grub-pc-bin isolinux live-build make mtools \
            qemu-system-x86 squashfs-tools syslinux-common xorriso
      - name: Validate project
        run: make test
      - name: Build ISO
        run: make build
      - name: Smoke-test ISO
        run: ./tests/smoke-iso.sh build/artifacts/*.iso
      - name: Verify ISO checksum
        working-directory: build/artifacts
        run: sha256sum --check *.sha256
      - name: Boot-test ISO in QEMU
        run: |
          set +e
          timeout --signal=TERM 45 qemu-system-x86_64 \
            -machine accel=tcg -m 2048 -smp 2 -boot once=d \
            -cdrom build/artifacts/*.iso -display none -serial none \
            -monitor none -no-reboot
          status=$?
          set -e
          test "${status}" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: ratanaos-iso
          path: |
            build/artifacts/*.iso
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
