name: RatanaOS CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'main'
  pull_request:
    branches:
      - main
  schedule:
    # Nightly builds from main at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  # ───────────────────────────────────────────────────────────────────
  validate:
    name: Validate Dependencies & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Pipeline Components
        run: |
          bash -n builder/build-iso.sh
          bash -n builder/build-live-usb.sh
          bash -n scripts/verify-iso.sh
          echo "✅ All scripts pass bash -n syntax check."

      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: project-status
          path: reports/PROJECT_STATUS.md

  # ───────────────────────────────────────────────────────────────────
  build-x86_64:
    name: Build ISO (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        profile:
          - ratana-lite
          - ratana-standard
          - ratana-developer
          - ratana-cyber
          - ratana-live
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap live-build grub-pc-bin \
            grub-efi-amd64-bin xorriso squashfs-tools mtools dosfstools rsync

      - name: Build ISO — ${{ matrix.profile }}
        run: |
          make iso EDITION=${{ matrix.profile }}

      - name: Verify artifacts
        run: |
          ls -lh releases/
          test -f releases/RatanaOS-*.iso || test -f releases/RatanaOS-*.img
          test -f releases/SHA256SUMS
          test -f releases/BUILD_REPORT.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RatanaOS-${{ matrix.profile }}-x86_64
          path: |
            releases/RatanaOS-*.iso
            releases/SHA256SUMS
            releases/BUILD_REPORT.md
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────
  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: build-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Testing Dependencies
        run: sudo apt-get install -y qemu-system-x86 ovmf

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: RatanaOS-ratana-standard-x86_64
          path: releases/

      - name: Run VM Tests
        run: |
          make vm EDITION=ratana-standard

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  # ───────────────────────────────────────────────────────────────────
  release:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: [build-x86_64, test-suite]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Organize Reports
        run: |
          mkdir -p release-artifacts/reports
          cp -r release-artifacts/test-reports/* release-artifacts/reports/ 2>/dev/null || true
          cp -r release-artifacts/project-status/* release-artifacts/reports/ 2>/dev/null || true

      - name: Create GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v21.0.0
          name: "RatanaOS v21.0 Ultimate"
          body: |
            ## RatanaOS v21.0 Ultimate
            
            New in this release:
            - Fully Integrated React Desktop UI (Ratana Web UI v25)
            - Complete Settings, Software Center, and Update Center
            - Real-Time CSS Dynamic Theming Engine (Light, Dark, High Contrast, AMOLED)
            - Ratana Recovery & Reliability Tools
            - 5 Core ISO Editions
            
            See [docs/RELEASE_NOTES.md](docs/RELEASE_NOTES.md) for details.
          files: |
            release-artifacts/**/*.iso
            release-artifacts/**/*.img
            release-artifacts/**/SHA256SUMS
            release-artifacts/reports/*
            docs/RELEASE_NOTES.md
            docs/RECOVERY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
